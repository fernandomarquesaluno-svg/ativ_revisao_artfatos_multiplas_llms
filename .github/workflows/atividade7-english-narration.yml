name: Activity 7 - English neural narration
on:
  push:
    branches:
      - video-atividade7-voz-neural-20261109
    paths:
      - '.github/workflows/atividade7-english-narration.yml'
      - 'video-atividade7-en/**'
  workflow_dispatch:
jobs:
  english_audio:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install phonemizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
      - name: Install free neural speech model
        run: python -m pip install -q "kokoro>=0.9.4" soundfile
      - name: Render English narration
        run: python video-atividade7-en/generate_en.py
      - name: Package nine audio segments
        uses: actions/upload-artifact@v4
        with:
          name: activity7-english-neural-voice
          path: video-atividade7-en/audio_en/*.wav
          retention-days: 7
