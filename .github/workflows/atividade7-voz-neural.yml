name: Atividade 7 - voz neural brasileira gratuita
on:
  push:
    branches:
      - video-atividade7-voz-neural-20261109
    paths:
      - '.github/workflows/atividade7-voz-neural.yml'
      - 'video-atividade7/**'
  workflow_dispatch:
jobs:
  narracao:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar fonemizador
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
      - name: Instalar motor Kokoro neural gratuito
        run: python -m pip install -q "kokoro>=0.9.4" soundfile
      - name: Gerar narração brasileira
        run: python video-atividade7/gerar_voz.py
      - name: Salvar audios em ZIP
        uses: actions/upload-artifact@v4
        with:
          name: atividade7-voz-brasileira-natural
          path: video-atividade7/audio_natural/*.wav
          retention-days: 7
